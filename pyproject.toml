[project]
name = "greenkeep"
version = "0.2.2"
description = "Scheduled, gated maintainer for your own repos: deterministic tools find problems, an LLM writes one patch per finding, and the PR auto-merges only when tests pass and every changed line is covered."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniil Petrov" }]
keywords = ["github", "maintenance", "automation", "llm", "pull-request", "auto-merge", "ruff", "coverage", "characterization-tests", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = ["claude-subprocess>=0.1.1", "tg-toolkit>=0.1.3", "packaging>=24", "nicegui-kit>=0.1.0"]

[project.urls]
Homepage = "https://github.com/octrow/greenkeep"
Issues = "https://github.com/octrow/greenkeep/issues"
Changelog = "https://github.com/octrow/greenkeep/blob/main/CHANGELOG.md"

[project.scripts]
greenkeep = "greenkeep.cli:main"
greenkeep-ui = "greenkeep.ui:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.uv.sources]
claude-subprocess = { git = "https://github.com/octrow/claude-cli", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ty.src]
include = ["src"]  # tests fake Workspace and Job with SimpleNamespace
