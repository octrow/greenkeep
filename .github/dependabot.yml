version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip releases younger than a week (hijacked-release window)
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip releases younger than a week (hijacked-release window)
    groups:
      minor-and-patch: { update-types: [minor, patch] }
